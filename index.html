<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="React 기반 개인 가계부 Mewallet" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="only light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mewallet" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/mewallet-v5.webmanifest" />
    <link rel="preload" as="image" href="/mewallet-loading-v1.png" />
    <link rel="icon" type="image/x-icon" href="/mewallet-v1-favicon.ico" />
    <link rel="icon" type="image/svg+xml" sizes="192x192" href="/mewallet-v2-launcher-192.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/mewallet-v1-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/mewallet-v1-apple-touch-icon.png" />
    <title>Mewallet</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #09090b;
      }

      body {
        min-height: 100vh;
      }
    </style>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('mywallet:theme');
          var savedStyleTheme = localStorage.getItem('mywallet:styleTheme');
          if (!savedTheme) {
            var v2 = localStorage.getItem('mywallet:v2');
            if (v2) {
              var parsed = JSON.parse(v2);
              savedTheme = parsed.theme;
              savedStyleTheme = parsed.styleTheme;
            }
          }
          var theme = savedTheme === 'dark' ? 'dark' : (savedTheme === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-style-theme', (savedStyleTheme === 'mememo' || savedStyleTheme === 'doodle') ? savedStyleTheme : 'default');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        #root > .app-loading-screen { position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;gap:33px;background:radial-gradient(circle at center,#18181b 0%,#09090b 100%); }
        #root > .app-loading-screen > .app-loading-mark { position:relative;display:grid;width:86px;height:86px;place-items:center; }
        #root > .app-loading-screen > .app-loading-mark,#root > .app-loading-screen > .app-loading-copy { transform:translateY(14px); }
        #root > .app-loading-screen > .app-loading-mark > .app-loading-logo { width:49px;height:49px;filter:drop-shadow(0 0 10px rgba(255,255,255,.15)); }
        #root > .app-loading-screen > .app-loading-mark > .app-loading-logo > .app-loading-glyph { display:block;width:100%;height:100%;background:linear-gradient(#ffffff,#ffffff);color-scheme:only light;opacity:1;-webkit-mask:url('/mewallet-loading-v1.png') center/contain no-repeat;mask:url('/mewallet-loading-v1.png') center/contain no-repeat;mask-mode:alpha; }
        #root > .app-loading-screen .app-loading-orbit-track,#root > .app-loading-screen .app-loading-orbit { position:absolute;inset:0;border-radius:50%; }
        #root > .app-loading-screen .app-loading-orbit-track { border:1.25px solid rgba(255,255,255,.12); }
        #root > .app-loading-screen .app-loading-orbit { background:conic-gradient(from -65deg,transparent 0deg 38deg,#ffffff 74deg,#a1a1aa 126deg,transparent 164deg 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 1.25px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 1.25px));animation:loadingOrbit 1.2s linear infinite; }
        html[data-style-theme="mememo"] #root > .app-loading-screen { background:radial-gradient(circle at center,#15241c 0%,#0a130e 100%); }
        html[data-style-theme="mememo"] #root > .app-loading-screen .app-loading-logo { filter:drop-shadow(0 0 16px rgba(82,183,136,.5)); }
        html[data-style-theme="mememo"] #root > .app-loading-screen .app-loading-orbit-track { border-color:rgba(82,183,136,.22); }
        html[data-style-theme="mememo"] #root > .app-loading-screen .app-loading-orbit { background:conic-gradient(from -65deg,transparent 0deg 38deg,#52b788 74deg,#2d6a4f 126deg,transparent 164deg 360deg); }
        html[data-style-theme="mememo"] #root > .app-loading-screen .app-loading-copy h1 span:first-child { color:#74c69d !important; }
        html[data-style-theme="mememo"] #root > .app-loading-screen .app-loading-copy h1 span:last-child { color:#52b788 !important; }
        html[data-style-theme="doodle"] #root > .app-loading-screen { background:radial-gradient(circle at center,#261f1a 0%,#120e0b 100%); }
        html[data-style-theme="doodle"] #root > .app-loading-screen .app-loading-logo { filter:drop-shadow(0 0 16px rgba(255,159,67,.45)); }
        html[data-style-theme="doodle"] #root > .app-loading-screen .app-loading-orbit-track { border-color:rgba(255,159,67,.22); }
        html[data-style-theme="doodle"] #root > .app-loading-screen .app-loading-orbit { background:conic-gradient(from -65deg,transparent 0deg 38deg,#ff9f43 74deg,#d35400 126deg,transparent 164deg 360deg); }
        html[data-style-theme="doodle"] #root > .app-loading-screen .app-loading-copy h1 span:last-child { color:#ff9f43 !important; }
        html[data-style-theme="default"] #root > .app-loading-screen .app-loading-logo,
        html:not([data-style-theme]) #root > .app-loading-screen .app-loading-logo { filter:drop-shadow(0 0 16px rgba(56,189,248,.45)); }
        html[data-style-theme="default"] #root > .app-loading-screen .app-loading-orbit,
        html:not([data-style-theme]) #root > .app-loading-screen .app-loading-orbit { background:conic-gradient(from -65deg,transparent 0deg 38deg,#38bdf8 74deg,#0284c7 126deg,transparent 164deg 360deg); }
        html[data-style-theme="default"] #root > .app-loading-screen .app-loading-orbit-track,
        html:not([data-style-theme]) #root > .app-loading-screen .app-loading-orbit-track { border-color:rgba(56,189,248,.22); }
        html[data-style-theme="default"] #root > .app-loading-screen .app-loading-copy h1 span:last-child,
        html:not([data-style-theme]) #root > .app-loading-screen .app-loading-copy h1 span:last-child { color:#38bdf8 !important; }
        #root > .app-loading-screen .app-loading-copy h1 { margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:1.9rem;font-weight:900;letter-spacing:-.03em; }
        @keyframes loadingOrbit { to { transform:rotate(360deg); } }
        @media (prefers-reduced-motion:reduce) { #root > .app-loading-screen .app-loading-orbit { animation-duration:3.5s; } }
        @media (max-width:768px) { #root > .app-loading-screen .app-loading-copy h1 { font-size:25.1px !important; } }
        #root > .app-loading-screen .app-loading-logo { filter:none !important;opacity:1; }
        #root > .app-loading-screen > .app-loading-mark > .app-loading-logo > .app-loading-glyph[data-painted="true"] { background:none;-webkit-mask:none;mask:none; }
      </style>
      <main class="app-loading-screen" role="status" aria-live="polite" aria-busy="true">
        <div class="app-loading-mark" aria-hidden="true">
          <span class="app-loading-orbit-track"></span>
          <span class="app-loading-orbit"></span>
          <div class="app-loading-logo">
            <canvas class="app-loading-glyph" width="49" height="49" aria-hidden="true"></canvas>
          </div>
        </div>
        <div class="app-loading-copy">
          <h1 style="margin:0;font-size:1.9rem;font-weight:900;letter-spacing:-0.03em;color:#ffffff;">
            <span>Me</span><span style="color:#e4e4e7;margin-left:2px;">wallet</span>
          </h1>
        </div>
      </main>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;background:#fef2f2;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;"><section style="width:min(720px,calc(100% - 32px));padding:32px;border-radius:24px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.08);"><p style="margin:0 0 8px;color:#b42318;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px;">Runtime Error</p><h1 style="margin:0 0 12px;font-size:28px;letter-spacing:-.04em;">앱 실행 중 오류가 발생했습니다.</h1><pre style="white-space:pre-wrap;line-height:1.5;color:#b42318;">' + String(event.message || 'Unknown error') + '</pre></section></main>';
      });
    </script>
    <script src="/mewallet-loading-v2.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
