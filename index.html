<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="React 기반 개인 가계부 MyWallet" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="color-scheme" content="only light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MyWallet" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>MyWallet</title>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('mywallet:theme');
          var savedStyleTheme = localStorage.getItem('mywallet:styleTheme');
          if (!savedTheme) {
            var v2 = localStorage.getItem('mywallet:v2');
            if (v2) {
              var parsed = JSON.parse(v2);
              savedTheme = parsed.theme;
              savedStyleTheme = parsed.styleTheme;
            }
          }
          var theme = savedTheme === 'dark' ? 'dark' : (savedTheme === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-style-theme', savedStyleTheme === 'doodle' ? 'doodle' : 'default');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        #root > .app-loading-screen { position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;gap:22px;background:radial-gradient(circle at center,#18181b 0%,#09090b 100%); }
        #root > .app-loading-screen > .app-loading-mark { position:relative;display:grid;width:136px;height:136px;place-items:center; }
        #root > .app-loading-screen > .app-loading-mark > .app-loading-logo { width:90px;height:90px;filter:drop-shadow(0 0 16px rgba(255,255,255,.15)); }
        #root > .app-loading-screen > .app-loading-mark > .app-loading-logo > img { width:100%;height:100%;object-fit:contain; }
        #root > .app-loading-screen .app-loading-orbit-track,#root > .app-loading-screen .app-loading-orbit { position:absolute;inset:0;border-radius:50%; }
        #root > .app-loading-screen .app-loading-orbit-track { border:2px solid rgba(255,255,255,.12); }
        #root > .app-loading-screen .app-loading-orbit { background:conic-gradient(from -65deg,transparent 0deg 38deg,#ffffff 74deg,#a1a1aa 126deg,transparent 164deg 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:loadingOrbit 1.2s linear infinite; }
        #root > .app-loading-screen .app-loading-copy h1 { margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:1.9rem;font-weight:900;letter-spacing:-.03em; }
        @keyframes loadingOrbit { to { transform:rotate(360deg); } }
        @media (prefers-reduced-motion:reduce) { #root > .app-loading-screen .app-loading-orbit { animation-duration:3.5s; } }
        @media (max-width:768px) { #root > .app-loading-screen .app-loading-copy h1 { font-size:24.32px !important; } }
      </style>
      <main class="app-loading-screen" role="status" aria-live="polite" aria-busy="true">
        <div class="app-loading-mark" aria-hidden="true">
          <span class="app-loading-orbit-track"></span>
          <span class="app-loading-orbit"></span>
          <div class="app-loading-logo">
            <img src="/logo.png" alt="MyWallet 로고" style="width:100%;height:100%;object-fit:contain;" />
          </div>
        </div>
        <div class="app-loading-copy">
          <h1 style="margin:0;font-size:1.9rem;font-weight:900;letter-spacing:-0.03em;color:#ffffff;">
            <span>My</span><span style="color:#e4e4e7;margin-left:2px;">Wallet</span>
          </h1>
        </div>
      </main>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;background:#fef2f2;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;"><section style="width:min(720px,calc(100% - 32px));padding:32px;border-radius:24px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.08);"><p style="margin:0 0 8px;color:#b42318;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px;">Runtime Error</p><h1 style="margin:0 0 12px;font-size:28px;letter-spacing:-.04em;">앱 실행 중 오류가 발생했습니다.</h1><pre style="white-space:pre-wrap;line-height:1.5;color:#b42318;">' + String(event.message || 'Unknown error') + '</pre></section></main>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
